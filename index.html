<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Adventure Game</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main id="game-container" aria-labelledby="game-title">
            <h1 id="game-title">Pirate Adventure</h1>
            <div id="question-container" aria-live="polite">
                <p id="question">Your adventure begins now...</p>
                <p id="conclusion" class="hidden"></p>
            </div>
            <ul id="answers" aria-label="Your choices">
                <!-- Answer buttons will be injected here by JavaScript -->
            </ul>
            <button id="next-btn" type="button" class="hidden">Play Again</button>
        </main>
        <script src="script.js"></script>
    </body>
</html>
